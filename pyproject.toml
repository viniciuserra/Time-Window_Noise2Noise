[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twn2n"
dynamic = ["version"]
description = "Time-Window Noise2Noise: self-supervised blind denoising of multichannel signals"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vinicius S. Vianna" },
    { name = "Tiago H. Machado" },
    { name = "Ilmar F. Santos" },
]
keywords = ["denoising", "self-supervised learning", "autoencoder", "vibration", "impact", "signal processing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "tensorflow>=2.10",
]

[project.optional-dependencies]
wavelets = ["PyWavelets>=1.4"]
examples = ["matplotlib>=3.5", "pandas>=1.5", "PyWavelets>=1.4", "jupyter"]
test = ["pytest>=7", "PyWavelets>=1.4"]

[project.urls]
Repository = "https://github.com/viniciuserra/Time-Window_Noise2Noise"
Preprint = "https://arxiv.org/abs/2608.24443"

[tool.setuptools]
packages = ["twn2n"]

[tool.setuptools.dynamic]
version = { attr = "twn2n.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that train a network (deselect with -m 'not slow')"]
